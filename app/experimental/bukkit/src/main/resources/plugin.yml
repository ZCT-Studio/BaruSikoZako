name: BaruSikoZakoBukkitBestEffort
main: io.github.zct_studio.barusikozako.bukkit.BukkitBestEffortPlugin
version: '${productVersion}'
api-version: '1.20'
description: Best-effort online backup for Bukkit 1.20.1+. Cross-file consistency NOT guaranteed.
author: ZCT Studio
website: https://github.com/ZCT-Studio/BaruSikoZako
commands:
  barusikozako:
    description: BaruSikoZako backup management
    usage: /barusikozako [status|backup <full|incremental>|restore <id>|verify <id>|config <set|get>|delete <id>]
    permission: barusikozako.command
permissions:
  barusikozako.command:
    description: Allows using /barusikozako commands
    default: op